name: Automated Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      browser:
        description: 'Browser to test'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - chromium
          - firefox
          - webkit

jobs:
  smoke-tests:
    name: Smoke Tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Playwright browsers
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps chromium"

      - name: Run smoke tests
        run: mvn clean test -DsuiteXmlFile=src/test/resources/testng/testng-smoke.xml
        continue-on-error: false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-results
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-screenshots
          path: target/screenshots/
          retention-days: 7

  cross-browser-tests:
    name: Cross-Browser Tests
    runs-on: ubuntu-latest
    needs: smoke-tests
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Playwright browsers
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps ${{ matrix.browser }}"

      - name: Run tests on ${{ matrix.browser }}
        run: mvn clean test -Dbrowser=${{ matrix.browser }} -DsuiteXmlFile=src/test/resources/testng/testng-chromium.xml
        continue-on-error: true

      - name: Upload test results for ${{ matrix.browser }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.browser }}-test-results
          path: target/surefire-reports/
          retention-days: 7

      - name: Upload screenshots for ${{ matrix.browser }}
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.browser }}-screenshots
          path: target/screenshots/
          retention-days: 7

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report

      - name: Upload Allure Report for ${{ matrix.browser }}
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.browser }}-allure-report
          path: target/site/allure-maven-plugin/
          retention-days: 14

  full-suite:
    name: Full Cross-Browser Suite
    runs-on: ubuntu-latest
    needs: cross-browser-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install all Playwright browsers
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps"

      - name: Run full test suite
        run: mvn clean test -DsuiteXmlFile=src/test/resources/testng/testng.xml
        continue-on-error: true

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report

      - name: Upload full suite Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-allure-report
          path: target/site/allure-maven-plugin/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-suite-test-results
          path: |
            target/surefire-reports/
            target/test-output/
          retention-days: 30

      - name: Publish Test Report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Test Results - Full Suite
          path: target/surefire-reports/TEST-*.xml
          reporter: java-junit
          fail-on-error: false

  report-status:
    name: Report Test Status
    runs-on: ubuntu-latest
    needs: [smoke-tests, cross-browser-tests]
    if: always()

    steps:
      - name: Check test results
        run: |
          echo "Smoke Tests: ${{ needs.smoke-tests.result }}"
          echo "Cross-Browser Tests: ${{ needs.cross-browser-tests.result }}"

          if [ "${{ needs.smoke-tests.result }}" == "failure" ]; then
            echo "❌ Smoke tests failed!"
            exit 1
          fi

          if [ "${{ needs.cross-browser-tests.result }}" == "failure" ]; then
            echo "⚠️ Some cross-browser tests failed, but continuing..."
          fi

          echo "✅ Test execution completed"
