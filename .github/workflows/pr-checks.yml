name: Pull Request Checks

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  pr-smoke-tests:
    name: PR Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Install Playwright Chromium
        run: mvn exec:java -e -D exec.mainClass=com.microsoft.playwright.CLI -D exec.args="install --with-deps chromium"

      - name: Run smoke tests
        run: mvn clean test -DsuiteXmlFile=src/test/resources/testng/testng-smoke.xml

      - name: Comment PR with results
        if: always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const testResults = fs.existsSync('target/surefire-reports/testng-results.xml');
            const message = testResults
              ? '✅ Smoke tests passed! Safe to merge.'
              : '❌ Smoke tests failed. Please review.';

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-smoke-test-results
          path: target/surefire-reports/
          retention-days: 3
