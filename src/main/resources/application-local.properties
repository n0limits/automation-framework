# ===================================================
# LOCAL ENVIRONMENT CONFIGURATION
# ===================================================
# Override settings for local development
# Usage: mvn test -Denv=local
# ===================================================

# ========== Web UI Configuration ==========
base.url=http://localhost:3000
headless=false

# ========== API Configuration ==========
api.base.url=http://localhost:8080/api

# ========== AWS Configuration ==========
# Use LocalStack for local AWS testing (optional)
aws.region=us-east-1
aws.stepfunctions.state.machine.arn=arn:aws:states:us-east-1:000000000000:stateMachine:LocalTestWorkflow
# LocalStack endpoint (uncomment if using LocalStack)
# aws.endpoint.override=http://localhost:4566

# ========== Database Configuration ==========
mongo.connection.string=mongodb://localhost:27017
sql.connection.string=jdbc:mysql://localhost:3306/testdb
postgres.connection.string=jdbc:postgresql://localhost:5432/testdb
