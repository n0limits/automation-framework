# ===================================================
# APPLICATION CONFIGURATION - DEFAULT (LOCAL)
# ===================================================
# This is the base configuration file
# Environment-specific files override these values
# ===================================================

# ========== Web UI Configuration ==========
base.url=https://trade.multibank.io
browser=chromium
headless=false
timeout=30000
screenshot.on.failure=true

# ========== API Configuration ==========
api.base.url=https://api.multibank.io
api.timeout=30000

# ========== AWS Configuration ==========
aws.region=us-east-1
aws.stepfunctions.state.machine.arn=arn:aws:states:us-east-1:123456789012:stateMachine:TradingWorkflow
aws.stepfunctions.execution.timeout=300000
aws.stepfunctions.poll.interval=5000

# Note: AWS Credentials should be set via environment variables:
# AWS_ACCESS_KEY_ID
# AWS_SECRET_ACCESS_KEY
# AWS_SESSION_TOKEN (optional, for assume role)

# ========== Database Configuration ==========
# MongoDB
mongo.connection.string=mongodb://localhost:27017
mongo.database=testdb

# MySQL
sql.connection.string=jdbc:mysql://localhost:3306/testdb
sql.username=root
sql.password=password

# PostgreSQL
postgres.connection.string=jdbc:postgresql://localhost:5432/testdb
postgres.username=postgres
postgres.password=password

# ========== Test Data ==========
test.data.path=src/test/resources/testdata

# ========== Reporting ==========
report.path=target/reports
