# ===================================================
# STAGING ENVIRONMENT CONFIGURATION
# ===================================================
# Override settings for staging environment
# Usage: mvn test -Denv=staging
# ===================================================

# ========== Web UI Configuration ==========
base.url=https://staging.trade.multibank.io
headless=true

# ========== API Configuration ==========
api.base.url=https://staging-api.multibank.io

# ========== AWS Configuration ==========
aws.region=us-east-1
aws.stepfunctions.state.machine.arn=arn:aws:states:us-east-1:123456789012:stateMachine:StagingTradingWorkflow

# Note: Use AWS credentials from environment variables
# Credentials should be configured in CI/CD pipeline secrets

# ========== Database Configuration ==========
mongo.connection.string=mongodb://staging-mongo.multibank.io:27017
mongo.database=staging_testdb

sql.connection.string=jdbc:mysql://staging-mysql.multibank.io:3306/staging_testdb
sql.username=staging_user
# Password from environment variable: SQL_PASSWORD

postgres.connection.string=jdbc:postgresql://staging-postgres.multibank.io:5432/staging_testdb
postgres.username=staging_user
# Password from environment variable: POSTGRES_PASSWORD
