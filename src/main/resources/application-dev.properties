# ===================================================
# DEVELOPMENT ENVIRONMENT CONFIGURATION
# ===================================================
# Override settings for development environment
# Usage: mvn test -Denv=dev
# ===================================================

# ========== Web UI Configuration ==========
base.url=https://dev.trade.multibank.io
headless=false

# ========== API Configuration ==========
api.base.url=https://dev-api.multibank.io

# ========== AWS Configuration ==========
aws.region=us-east-1
aws.stepfunctions.state.machine.arn=arn:aws:states:us-east-1:123456789012:stateMachine:DevTradingWorkflow

# Note: Use AWS credentials from environment variables
# AWS_ACCESS_KEY_ID
# AWS_SECRET_ACCESS_KEY

# ========== Database Configuration ==========
mongo.connection.string=mongodb://dev-mongo.multibank.io:27017
mongo.database=dev_testdb

sql.connection.string=jdbc:mysql://dev-mysql.multibank.io:3306/dev_testdb
sql.username=dev_user
# Password from environment variable: SQL_PASSWORD

postgres.connection.string=jdbc:postgresql://dev-postgres.multibank.io:5432/dev_testdb
postgres.username=dev_user
# Password from environment variable: POSTGRES_PASSWORD
