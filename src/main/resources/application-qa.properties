# ===================================================
# QA ENVIRONMENT CONFIGURATION
# ===================================================
# Override settings for QA/testing environment
# Usage: mvn test -Denv=qa
# ===================================================

# ========== Web UI Configuration ==========
base.url=https://qa.trade.multibank.io
headless=true

# ========== API Configuration ==========
api.base.url=https://qa-api.multibank.io

# ========== AWS Configuration ==========
aws.region=us-east-1
aws.stepfunctions.state.machine.arn=arn:aws:states:us-east-1:123456789012:stateMachine:QATradingWorkflow

# Note: Use AWS credentials from environment variables
# AWS_ACCESS_KEY_ID
# AWS_SECRET_ACCESS_KEY

# ========== Database Configuration ==========
mongo.connection.string=mongodb://qa-mongo.multibank.io:27017
mongo.database=qa_testdb

sql.connection.string=jdbc:mysql://qa-mysql.multibank.io:3306/qa_testdb
sql.username=qa_user
# Password from environment variable: SQL_PASSWORD

postgres.connection.string=jdbc:postgresql://qa-postgres.multibank.io:5432/qa_testdb
postgres.username=qa_user
# Password from environment variable: POSTGRES_PASSWORD
