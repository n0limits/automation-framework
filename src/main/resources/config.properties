# Web UI Configuration
# Using Sauce Demo - a free test automation practice website
# URL: https://www.saucedemo.com
# Valid credentials: standard_user / secret_sauce
# After login, redirects to /inventory.html (product catalog page)
#
# Alternative local development: http://localhost:3000
# Alternative test environment: https://your-app-test.company.com
base.url=https://www.saucedemo.com
browser=chromium
headless=false
timeout=30000
screenshot.on.failure=true

# API Configuration
# Using JSONPlaceholder - a free fake REST API for testing
# You can replace this with your actual API endpoint:
#   - Local development: http://localhost:8080/api
#   - Mock server: http://localhost:3000
#   - Test environment: https://api-test.yourcompany.com
api.base.url=https://jsonplaceholder.typicode.com
api.timeout=30000

# Database Configuration - MongoDB
mongo.connection.string=mongodb://localhost:27017
mongo.database=testdb

# Database Configuration - SQL
sql.connection.string=jdbc:mysql://localhost:3306/testdb
sql.username=root
sql.password=password

# PostgreSQL Configuration
postgres.connection.string=jdbc:postgresql://localhost:5432/testdb
postgres.username=postgres
postgres.password=password

# Test Data
test.data.path=src/test/resources/testdata

# Reporting
report.path=target/reports