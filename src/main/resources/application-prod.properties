# ===================================================
# PRODUCTION ENVIRONMENT CONFIGURATION
# ===================================================
# Override settings for production environment
# Usage: mvn test -Denv=prod
# WARNING: Use with extreme caution!
# ===================================================

# ========== Web UI Configuration ==========
base.url=https://trade.multibank.io
headless=true

# ========== API Configuration ==========
api.base.url=https://api.multibank.io

# ========== AWS Configuration ==========
aws.region=us-east-1
aws.stepfunctions.state.machine.arn=arn:aws:states:us-east-1:123456789012:stateMachine:ProdTradingWorkflow

# Note: Production AWS credentials MUST come from environment variables
# Credentials should be configured in CI/CD pipeline secrets with strict access controls

# ========== Database Configuration ==========
# Production database credentials MUST come from environment variables
mongo.connection.string=mongodb://prod-mongo.multibank.io:27017
mongo.database=prod_db

sql.connection.string=jdbc:mysql://prod-mysql.multibank.io:3306/prod_db
sql.username=prod_readonly_user
# Password from environment variable: SQL_PASSWORD

postgres.connection.string=jdbc:postgresql://prod-postgres.multibank.io:5432/prod_db
postgres.username=prod_readonly_user
# Password from environment variable: POSTGRES_PASSWORD
